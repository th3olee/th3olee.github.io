<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <link href="{{ "css/main.css" | relURL }}" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="container mx-auto flex justify-between items-center py-6">
    <h1 class="text-3xl font-bold"><a href="/blog/" class="hover:underline">Blog</a></h1>
    <nav>
      <a href="/" class="text-blue-500 hover:underline">Accueil</a>
    </nav>
  </header>

  <main class="container mx-auto py-10">
    <h2 class="text-4xl font-bold">{{ .Title }}</h2>
    <p class="text-gray-600">{{ .Date.Format "02 Janvier 2006" }}</p>
    <div class="mt-6 prose max-w-3xl">
      {{ .Content }}
    </div>
    <a href="/blog/" class="mt-6 inline-block text-blue-500 hover:underline">← Retour au blog</a>
  </main>
</body>
</html>
