{{ define "main" }}

<section>
    <h2 class="text-2xl font-semibold text-white mb-6">Dev & Design</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
      {{ range .Params.techStack.devAndDesign }}
        <div class="dark:bg-custom-dark-gray bg-custom-light-gray rounded-xl p-4 hover:bg-custom-light-blue transition-colors cursor-pointer">
          <div class="text-center">
            <img src="{{ .icon }}" alt="{{ .name }}" class="h-12 mx-auto mb-2">
            <h3 class="text-lg font-bold">{{ .name }}</h3>
            <p class="text-sm text-gray-300">{{ .description }}</p>
          </div>
        </div>
      {{ end }}
    </div>
  </section>
  

{{ end }}
