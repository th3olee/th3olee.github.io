<div class="bg-white shadow-lg rounded-lg pl-4 pt-4 pb-6' flex mt-4">
    <div class="flex-1 flex flex-col ">
        <img class="w-16 h-16 rounded-full  mb-8" src="{{ .avatar }}" alt="Avatar de {{ .name }}">
        <h3 class="text-3xl font-semibold mb-8">{{ .name }}</h3>
        <p class="text-gray-600 mb-2 text-lg">{{ .bio }}</p>
        <div class="mb-8 ">
            <a href="{{ .link }}" class="text-gray-400 hover:underline text-2xl ">Voir le projet →</a>
        </div>
    </div>
    <div class="flex-none">
        <img class="object-cover w-96 h-96" src="{{ .image }}" alt="Image">
    </div>
</div>
